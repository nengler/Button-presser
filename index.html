<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'"
    />
    <title>Button Presser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="brand">
      <p class="brand-name">Button Presser</p>
      <p class="tagline">Hit the beat. Closer is better.</p>
    </header>

    <main class="stage">
      <div class="meter" aria-hidden="true">
        <div id="pulse" class="pulse"></div>
        <div id="ring" class="ring"></div>
      </div>

      <div class="readout">
        <div class="stat">
          <span class="label">Score</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">Streak</span>
          <span id="streak" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">Best</span>
          <span id="best" class="value">0</span>
        </div>
      </div>

      <p id="feedback" class="feedback" data-grade="">Ready</p>
      <p id="error" class="error">—</p>

      <div class="controls">
        <button id="start" type="button" class="ghost">Start</button>
        <button id="press" type="button" class="press" disabled>Press</button>
      </div>
      <p class="hint">Space also works</p>
    </main>

    <aside class="shop">
      <div class="shop-head">
        <h2>Upgrades</h2>
        <button id="reset" type="button" class="textish">Reset</button>
      </div>
      <div id="upgrades" class="upgrade-list"></div>
    </aside>

    <script type="module" src="./dist/renderer.js"></script>
  </body>
</html>
